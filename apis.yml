aid: spideroak
name: SpiderOak
description: 'SpiderOak (SpiderOak, Inc. / SpiderOak Mission Systems) builds zero-trust access governance
  and secure data exchange software for defense, aerospace and commercial operators working in contested,
  disconnected, degraded, intermittent and low-bandwidth (DDIL) environments. Its developer surface is
  Aranya, the open-source access-governance and secure-data-exchange platform that also powers the commercial
  OrbitSecure product: a Rust client library, a long-running daemon, a domain-specific policy language
  with its own compiler and virtual machine, and Aranya Fast Channels (AFC) for buffer-based encryption
  without a transport. Aranya ships a public C API (a cbindgen-generated header with 111 public functions)
  and a Rust API published as 31 crates on crates.io, with documentation, specifications and a 57-term
  glossary on the Aranya Project docs site. SpiderOak also operates the legacy SpiderOak ONE no-knowledge
  encrypted backup product and Tactical Edge Cyber Services (TECS) consulting.'
