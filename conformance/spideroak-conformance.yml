  market: defense / aerospace / cryptographic module validation
  declared_in_contract: false
  note: 'REWARD-ONLY check, honestly negative. The published contract — aranya-client.h and the Rust crates — declares
    no domain-standard signature: no SCIM schema URN, no OData $metadata, no OpenRTB, no Sparkplug topic namespace,
