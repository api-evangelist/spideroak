note: SpiderOak has no HTTP/REST API, so the usual cross-cutting web-API standards (OAuth2, OIDC, JSON:API, RFC
  9457, OData, SCIM, pagination conventions) are all not-applicable rather than failed. What it does assert is transport-cryptography
  and regulatory conformance. Every entry below carries the exact page or release that states it; nothing is inferred
  from marketing category.
