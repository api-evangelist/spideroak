- id: scim
  conforms: false
  applicable: false
  evidence: 'No SCIM schema URN and no /scim endpoint. Identity is device-scoped and cryptographic, not directory-provisioned.
    (Note: the unrelated legacy SpiderOak Blue product shipped LDAP sync via github.com/SpiderOak/netkes, last pushed
    2025-06-04 — LDAP, not SCIM.)'
- id: mtls
  conforms: true
  applicable: true
  evidence: 'v7.0.1 (2026-08-12) release: "use certificate-based mTLS for sync" (PR #786). Published specification
    at https://aranya-project.github.io/mtls/. Certificate generation tool aranya-certgen added in v5.0.0.'
- id: quic
  conforms: true
  applicable: true
  evidence: 'QUIC syncer is the default sync transport; published specification at https://aranya-project.github.io/aranya-quic-channels/.
    Glossary defines QUIC as "a general-purpose transport layer network protocol that utilizes several multiplexed
    UDP connections". Config surface: aranya_create_team_quic_sync_config_* / aranya_add_team_quic_sync_config_*.'
- id: hipaa
  conforms: true
  applicable: true
  evidence: 'https://spideroak.com/hipaa/ states CrossClave, SpiderOak One, CrossClave Groups and Semaphor are "HIPAA-compliant
    as a Business Associate", complying with both the Privacy Rule and the Security Rule. Scope note: this claim
    covers the legacy consumer/collaboration products, NOT the Aranya developer platform.'
- id: gdpr
  conforms: true
  applicable: true
  evidence: 'https://spideroak.one/gdpr.md — "SpiderOakONE complies with the EU General Data Protection Regulation
    with No Knowledge encryption", including the right to be forgotten. Scope: SpiderOak ONE.'
- id: fips-140
  conforms: claimed
  applicable: true
  evidence: https://spideroak.com/product/ lists "Certifications (e.g. FIPS)" as a Team & Enterprise tier feature
    and explicitly NOT available in the Open Source edition. The aranya-project GitHub org also carries an "acvp"
    repository (NIST Automated Cryptographic Validation Protocol, the machine-readable test-vector protocol behind
    CAVP/FIPS 140-3 algorithm validation), last pushed 2025-01-17. No CMVP or CAVP certificate number is published,
    so this is recorded as CLAIMED and tier-gated, not verified.
- id: zero-trust
  conforms: claimed
  applicable: true
  evidence: https://spideroak.com/product/ describes a zero-trust architecture with RBAC, advanced segmentation
    and secure data exchange "without the need for additional network security controls". No NIST SP 800-207 self-assessment
    or third-party attestation is published.
