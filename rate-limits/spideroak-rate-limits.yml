  quota to enforce, no 429, and no X-RateLimit-*/RateLimit-*/Retry-After headers because there are no HTTP responses
  at all. Probed the technical-apis pages, the getting-started walkthrough, the full C header and every release
  note without finding a documented limit, throttle or backpressure quota.'
